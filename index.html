<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Славянский кликер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="creation-modal" class="modal open">
      <div class="modal-content">
        <h2>Создание персонажа</h2>
        <p class="modal-note">Выбери пол, имя и собери облик из доступных слоёв. Позже можно изменить через Волшебный гребень.</p>
        <div class="modal-row">
          <button class="pill active" data-gender="male">Юноша</button>
          <button class="pill" data-gender="female">Девица</button>
        </div>
        <div class="modal-row">
          <label for="hero-name-input">Имя героя</label>
          <input id="hero-name-input" maxlength="16" placeholder="до 16 символов" />
        </div>
        <div class="slots-grid">
          <div class="slot" data-slot="head">
            <div class="slot-title">Голова</div>
            <div class="slot-controls">
              <button class="slot-prev" data-slot-btn="head">◀</button>
              <img id="slot-head" alt="head preview">
              <button class="slot-next" data-slot-btn="head">▶</button>
            </div>
          </div>
          <div class="slot" data-slot="torso">
            <div class="slot-title">Торс</div>
            <div class="slot-controls">
              <button class="slot-prev" data-slot-btn="torso">◀</button>
              <img id="slot-torso" alt="torso preview">
              <button class="slot-next" data-slot-btn="torso">▶</button>
            </div>
          </div>
          <div class="slot" data-slot="armor">
            <div class="slot-title">Броня</div>
            <div class="slot-controls">
              <button class="slot-prev" data-slot-btn="armor">◀</button>
              <img id="slot-armor" alt="armor preview">
              <button class="slot-next" data-slot-btn="armor">▶</button>
            </div>
          </div>
          <div class="slot" data-slot="weapon">
            <div class="slot-title">Оружие</div>
            <div class="slot-controls">
              <button class="slot-prev" data-slot-btn="weapon">◀</button>
              <img id="slot-weapon" alt="weapon preview">
              <button class="slot-next" data-slot-btn="weapon">▶</button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="start-game" class="primary">Начать сказание</button>
        </div>
      </div>
    </div>

    <header class="top-bar">
      <div class="logo">Былинный Кликер</div>
      <div class="status-panel">
        <div class="status-item" id="cp">CP 1</div>
        <div class="status-item" id="biome">Биом: Злой лес</div>
        <div class="status-item" id="day-slider"></div>
        <div class="status-item" id="timer">04:00</div>
        <div class="status-item" id="settings">⚙️</div>
      </div>
    </header>

    <main class="main-layout">
      <aside class="active-buttons">
        <button class="active-btn" id="btn-wand" title="Палочка-выручалочка">🎇</button>
        <button class="active-btn" id="btn-boots" title="Сапоги-скороходы">🥾</button>
        <button class="active-btn" id="btn-hat" title="Шапка-невидимка">🎩</button>
        <button class="active-btn" id="btn-comb" title="Волшебный гребень">💇</button>
        <button class="active-btn" id="btn-ball" title="Волшебный клубочек">🧶</button>
        <button class="active-btn" id="btn-flower" title="Цветик-семицветик">🌸</button>
      </aside>

      <section class="battle">
        <div class="battle-bg layer back"></div>
        <div class="battle-bg layer mid"></div>
        <div class="battle-ground"></div>
        <div id="hero" class="hero">
          <div class="hero-name" id="hero-name">Герой</div>
          <img class="layer torso" alt="torso">
          <img class="layer armor" alt="armor">
          <img class="layer head" alt="head">
          <img class="layer weapon" alt="weapon">
        </div>
        <div id="enemies" class="enemies"></div>
        <div id="enemy-count" class="wave-progress">ВРАГИ 60/60</div>
        <div id="wave-timer" class="wave-timer">04:00</div>
      </section>

      <aside class="currency-panel">
        <div class="currency">
          <img src="sprites/Монеты/Медная монета.png" alt="Cu">
          <div>
            <div>Cu</div>
            <div id="cu-value">0</div>
          </div>
        </div>
        <div class="currency">
          <img src="sprites/Монеты/Серебряная монета.png" alt="Ag">
          <div>
            <div>Ag</div>
            <div id="ag-value">0</div>
          </div>
        </div>
        <div class="currency">
          <img src="sprites/Монеты/Золотая монета.png" alt="Au">
          <div>
            <div>Au</div>
            <div id="au-value">0</div>
          </div>
        </div>
        <div class="currency">
          <div class="rune">Бы</div>
          <div>
            <div>Былины</div>
            <div id="by-value">0</div>
          </div>
        </div>
        <div class="currency">
          <div class="rune">Под</div>
          <div>
            <div>Подвиги</div>
            <div id="pd-value">0</div>
          </div>
        </div>
      </aside>
    </main>

    <section class="click-panel">
      <button id="btn-larchik" class="click-btn">
        <img src="sprites/Основная кнопка для клика -добычи монет/Волшебный ларчик.png" alt="Ларчик">
        <span>Получить добычу</span>
      </button>
      <button id="btn-sword" class="click-btn">
        <img src="sprites/Основная кнопка для клика -ускорения ударов/Меч кладенец.png" alt="Меч кладенец">
        <span>Ударить</span>
      </button>
    </section>

    <nav class="tabs">
      <button data-tab="gathering" class="tab-btn active">Собирательство</button>
      <button data-tab="heroes" class="tab-btn">Герои</button>
      <button data-tab="upgrades" class="tab-btn">Улучшения</button>
      <button data-tab="rebirth" class="tab-btn">Перерождение</button>
      <button data-tab="shop" class="tab-btn">Магазин</button>
      <button data-tab="pets" class="tab-btn">Питомцы</button>
    </nav>

    <section id="tab-content" class="tab-content"></section>
  </div>
  <script src="main.js" type="module"></script>
</body>
</html>
